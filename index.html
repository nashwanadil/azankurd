<script>
/* ---------- الألوان والمظهر ---------- */
const THEMES = [
  {id:"earth",   h:20,  s:28, accent:"#e0b860", accentL:"#946512", btn:"#8f2a39"},
  {id:"emerald", h:160, s:32, accent:"#e0b860", accentL:"#8a6510", btn:"#1f7a5a"},
  {id:"night",   h:222, s:34, accent:"#e0b860", accentL:"#8a6510", btn:"#3b56b0"},
  {id:"royal",   h:255, s:28, accent:"#d9b25f", accentL:"#7d5bc4", btn:"#5a45b0"},
  {id:"teal",    h:186, s:38, accent:"#f0c674", accentL:"#0f7c7c", btn:"#128a8a"},
  {id:"onyx",    h:30,  s:4,  accent:"#e0b860", accentL:"#8a6510", btn:"#8a6a2a"},
  {id:"rose",    h:332, s:24, accent:"#eab6ca", accentL:"#a03a6a", btn:"#a03a6a"},
  {id:"sand",    h:36,  s:38, accent:"#eeaa45", accentL:"#9a5c0c", btn:"#b5651d"},
  {id:"olive",   h:80,  s:20, accent:"#dcc574", accentL:"#5f6a1c", btn:"#5d7a3a"},
  {id:"sky",     h:205, s:45, accent:"#93d2ff", accentL:"#1f6fb0", btn:"#1f78c8"}
];
function themeVars(t, mode){
  const H=t.h, S=t.s, hsl=(s,l)=>`hsl(${H} ${s}% ${l}%)`;
  return mode === "light" ? {
    bg:hsl(S*.7,95), card:hsl(S*.6,99), line:hsl(S*.5,85), inner:hsl(S*.6,93), hover:hsl(S*.6,89),
    text:hsl(Math.min(S,30),13), muted:hsl(Math.min(S,18),38), title:hsl(Math.min(S,30),13),
    gold:t.accentL, green:t.btn, glow:hsl(S*.8,88)
  } : {
    bg:hsl(S,12), card:hsl(S,16.5), line:hsl(S,25), inner:hsl(S,13.5), hover:hsl(S,21),
    text:hsl(Math.min(S,30),92), muted:hsl(Math.min(S,20),68), title:"#ffffff",
    gold:t.accent, green:t.btn, glow:hsl(S,22)
  };
}
function applyTheme(){
  let id="earth", mode="light";
  try{ id = localStorage.getItem("theme") || id; mode = localStorage.getItem("mode") || mode; }catch(e){}
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  const v = themeVars(t, mode), r = document.documentElement.style;
  Object.entries(v).forEach(([k,val])=> r.setProperty("--"+k, val));
  document.documentElement.dataset.mode = mode;
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = v.bg;
}
applyTheme();
</script>

    transition:background .15s,border-color .15s

  .pill:hover,.pill[aria-expanded=true]{background:var(--hover);border-color:var(--gold)}
  .pill .chev{width:14px;height:14px;opacity:.7;transition:transform .2s}
  .pill[aria-expanded=true] .chev{transform:rotate(180deg)}
  .langwrap{position:relative}
  html[data-mode=light] .menu,html[data-mode=light] .sheet{box-shadow:0 14px 40px rgba(60,40,20,.18)}

    position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:20;width:230px;max-height:62vh;overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;
    box-shadow:0 14px 40px rgba(0,0,0,.45)
  }
  .menu[hidden]{display:none}
  .menu button{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:none;border:0;color:var(--text);font-family:inherit;font-size:.95rem;
    padding:8px 12px;border-radius:9px;cursor:pointer;text-align:start

  .menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
  .menu button .code{color:var(--muted);font-size:.75rem;font-family:'Noto Sans',sans-serif;text-transform:uppercase}
  .menu button[aria-checked=true]{color:var(--gold)}
  .menu button[aria-checked=true] .code{color:var(--gold)}

  /* الرأس */
  header{text-align:center;padding:32px 16px 28px}
  .brand{display:flex;align-items:center;justify-content:center;gap:14px}
  .brand img{width:60px;height:60px;border-radius:15px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .logo{font-family:'Amiri',serif;font-size:3rem;color:var(--title);font-weight:700;letter-spacing:1px}
  .sub{color:var(--muted);font-size:.95rem;margin-top:4px}
  main{max-width:720px;margin:0 auto;padding:0 16px 48px}
  section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;margin-bottom:24px}
  h2{font-size:1.15rem;color:var(--gold);margin-bottom:18px;text-align:center;font-weight:600}

  /* الآذان */
  .azan{text-align:center}
  .azan .ar{font-family:'Amiri',serif;font-size:1.65rem;line-height:2.3;direction:rtl}
  .azan .tr{color:var(--muted);font-size:.95rem;margin-top:4px}

  .next .count{font-size:2rem;font-variant-numeric:tabular-nums;letter-spacing:2px;direction:ltr}
  .times{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
  .t{background:var(--inner);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
  .t.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .t span{display:block;color:var(--muted);font-size:.85rem}

  .loc{text-align:center;color:var(--muted);font-size:.85rem;margin-top:14px}
  .methodline{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);font-family:inherit;font-size:.8rem;cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px}
  .methodline:hover{color:var(--gold)}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  input,.btn{font-family:inherit;font-size:.95rem;border-radius:10px;border:1px solid var(--line);padding:8px 14px}
  input{background:var(--inner);color:var(--text);min-width:0;flex:1;max-width:240px}
  .btn{background:var(--green);color:#fff;border-color:var(--green);cursor:pointer}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}

  .sheet-head h3{font-size:1.1rem;color:var(--gold);font-weight:600}
  .iconbtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}

  .field{margin-bottom:16px}
  .field label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:6px}
  .field select{width:100%;background:var(--inner);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.92rem}
  .seg{display:flex;background:var(--inner);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;background:none;border:0;color:var(--muted);font-family:inherit;font-size:.92rem;padding:7px;border-radius:8px;cursor:pointer}

  .seg button[aria-pressed=true]{background:var(--green);color:#fff}

  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);cursor:pointer;position:relative;padding:0;max-width:48px;justify-self:center;width:100%}

  .sw[aria-pressed=true]{border-color:var(--text);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--gold)}
  .seg button svg.ic{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 32px}

function pickLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if(q && I18N[q]) return q;
  const s = store.get("lang", null);
  if(s === "ckb" || s === "kmr") return "ku";
  if(s && I18N[s]) return s;
  for(const n of (navigator.languages || [navigator.language || "ar"])){
    const c = n.toLowerCase();
    if(c.startsWith("ckb") || c.startsWith("ku") || c.startsWith("kmr")) return "ku";
    const p = c.slice(0,2); if(I18N[p]) return p;
  }
  return "ar";
}

function buildLangMenu(){
  const menu = document.getElementById("langMenu");
  menu.innerHTML = "";
  Object.entries(I18N).forEach(([code,t])=>{
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role","menuitemradio");
    b.setAttribute("aria-checked", code === lang ? "true" : "false");
    b.innerHTML = `<span dir="${t.dir}">${t.label}</span><span class="code">${code}</span>`;
    b.onclick = ()=>{ setLang(code); closeLangMenu(); document.getElementById("langBtn").focus(); };
    menu.appendChild(b);
  });
}
function openLangMenu(){
  buildLangMenu();
  const menu = document.getElementById("langMenu"), btn = document.getElementById("langBtn");
  menu.hidden = false; btn.setAttribute("aria-expanded","true");
  const cur = menu.querySelector('[aria-checked="true"]'); if(cur){ cur.focus(); cur.scrollIntoView({block:"nearest"}); }
}
function closeLangMenu(){
  document.getElementById("langMenu").hidden = true;
  document.getElementById("langBtn").setAttribute("aria-expanded","false");
}
function setLang(code){ lang = code; store.set("lang", code); applyLang(); }

function applyLang(){
  const t = L();
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.title = t.logo + " | AzanKurd";
  document.getElementById("logo").textContent = t.logo;
  document.getElementById("langName").textContent = t.label;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t[el.dataset.i]);
  document.getElementById("cityInput").placeholder = t.cityPh;
  document.getElementById("settingsBtn").setAttribute("aria-label", t.settings);
  document.getElementById("closeSettings").setAttribute("aria-label", t.close);
  renderAdhan();
  fillSettings();
  if(lastData) render(lastData, lastLabel); else document.getElementById("locText").textContent = t.locating;
}

function renderAdhan(){
  const t = L(), box = document.getElementById("azan"); box.innerHTML = "";
  ADHAN.forEach((group,i)=>{
    if(i) box.insertAdjacentHTML("beforeend",'<div class="divider"></div>');
    group.forEach(([ar])=> box.insertAdjacentHTML("beforeend",`<p class="ar">${ar}</p>`));
    if(t.adhan){
      [...new Set(group.map(g=>g[1]))].forEach(k=>
        box.insertAdjacentHTML("beforeend",`<p class="tr">${t.adhan[k]}</p>`));
    }
  });
  box.insertAdjacentHTML("beforeend",
    `<div class="divider"></div><p class="note">${t.fajrNote}</p><p class="ar">الصلاةُ خيرٌ من النوم</p>` +
    (t.adhan ? `<p class="tr">${t.adhan.sleep}</p>` : ""));
}

/* ---------- عرض الوقت ---------- */
function fmtTime(hhmm){
  if(timeFmt === "24") return hhmm;
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date(2000,0,1,h,m);
  const loc = lang === "ku" ? "ar" : lang;
  try{
    return new Intl.DateTimeFormat(loc + "-u-nu-latn",{hour:"numeric",minute:"2-digit",hour12:true}).format(d);
  }catch(e){
    return `${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`;
  }
}

/* ---------- المواقيت ---------- */
function render(data, label){
  lastData = data; lastLabel = label;
  const t = L();
  timings = data.timings; tz = data.meta.timezone;
  const box = document.getElementById("times"); box.innerHTML = "";
  ORDER.forEach(k=>{
    const d = document.createElement("div"); d.className="t"; d.id="t-"+k;
    d.innerHTML = `<span>${t.names[k]}</span><b>${fmtTime(timings[k].slice(0,5))}</b>`;
    box.appendChild(d);
  });
  const h = data.date.hijri;
  const month = (t.dir==="rtl") ? h.month.ar : h.month.en;
  const place = label === "@here" ? t.yourLoc : label;
  document.getElementById("locText").textContent = `${place} — ${h.day} ${month} ${h.year} ${t.hijri}`;
  document.getElementById("methodLine").textContent = `${t.methodLabel}: ${METHODS[usedMethod] || ""}`;
  clearInterval(timer); tick(); timer = setInterval(tick, 1000);
}

function nowInTz(){ return new Date(new Date().toLocaleString("en-US",{timeZone:tz,hour12:false})); }

function tick(){
  if(!timings) return;
  const now = nowInTz();
  let next = null, nextDate = null;
  for(const k of ORDER){
    if(k==="Sunrise") continue;
    const [h,m] = timings[k].slice(0,5).split(":").map(Number);
    const d = new Date(now); d.setHours(h,m,0,0);
    if(d > now){ next = k; nextDate = d; break; }
  }
  if(!next){
    const [h,m] = timings.Fajr.slice(0,5).split(":").map(Number);
    nextDate = new Date(now); nextDate.setDate(now.getDate()+1); nextDate.setHours(h,m,0,0); next="Fajr";
  }
  const diff = Math.max(0, Math.floor((nextDate-now)/1000));
  const p = n => String(n).padStart(2,"0");
  document.getElementById("nextName").textContent = L().names[next];
  document.getElementById("countdown").textContent = `${p(Math.floor(diff/3600))}:${p(Math.floor(diff%3600/60))}:${p(diff%60)}`;
  ORDER.forEach(k=>document.getElementById("t-"+k).classList.toggle("active", k===next));
}

function schoolFor(method){
  if(asrChoice === "auto") return method === HANAFI_METHOD ? 1 : 0;
  return Number(asrChoice);
}
function apiUrl(q, method){
  const base = "https://api.aladhan.com/v1/";
  const p = `method=${method}&school=${schoolFor(method)}`;
  return q.type === "coords"
    ? `${base}timings?latitude=${q.lat}&longitude=${q.lng}&${p}`
    : `${base}timingsByAddress?address=${encodeURIComponent(q.city)}&${p}`;
}

async function getTimes(q){
  let method = methodChoice === "auto" ? 3 : Number(methodChoice);
  let j = await (await fetch(apiUrl(q, method))).json();
  if(j.code !== 200) throw 0;
  if(methodChoice === "auto"){
    const best = autoMethod(j.data.meta.timezone);
    if(best !== method){
      method = best;
      j = await (await fetch(apiUrl(q, method))).json();
      if(j.code !== 200) throw 0;
    }
  }
  usedMethod = method;
  if(methodChoice === "auto") autoUsed = method;
  lastQuery = q;
  render(j.data, q.type === "coords" ? "@here" : q.city);
  fillSettings();
}

async function byCoords(lat, lng){
  try{ await getTimes({type:"coords", lat, lng}); }catch(e){ fallback(); }
}
async function byCity(city){
  try{ await getTimes({type:"city", city}); }
  catch(e){ document.getElementById("locText").textContent = L().notFound; }
}
function searchCity(){ const v = document.getElementById("cityInput").value.trim(); if(v) byCity(v); }
function fallback(){ byCity("Mecca"); }
function useLocation(){
  if(!navigator.geolocation) return fallback();
  navigator.geolocation.getCurrentPosition(
    p=>byCoords(p.coords.latitude, p.coords.longitude), ()=>fallback(), {timeout:8000});
}

/* ---------- الإعدادات ---------- */
function fillSettings(){
  const t = L();
  const ms = document.getElementById("methodSelect");
  let html = `<option value="auto">${t.auto}${autoUsed !== null ? " · " + METHODS[autoUsed] : ""}</option>`;
  Object.entries(METHODS).forEach(([id,name])=> html += `<option value="${id}">${name}</option>`);
  ms.innerHTML = html; ms.value = methodChoice;

  const as = document.getElementById("asrSelect");
  as.innerHTML = `<option value="auto">${t.auto}</option><option value="0">${t.standard}</option><option value="1">${t.hanafi}</option>`;
  as.value = asrChoice;

  document.querySelectorAll(".seg button[data-fmt]").forEach(b=> b.setAttribute("aria-pressed", b.dataset.fmt === timeFmt ? "true" : "false"));
  const mode = store.get("mode","light"), theme = store.get("theme","earth");
  document.querySelectorAll(".seg button[data-mode]").forEach(b=> b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false"));
  const sw = document.getElementById("swatches"); sw.innerHTML = "";
  THEMES.forEach((th,i)=>{
    const v = themeVars(th, mode), b = document.createElement("button");
    b.type = "button"; b.className = "sw";
    b.style.background = v.bg; b.style.setProperty("--a", th.btn);
    b.setAttribute("aria-label", `${t.color} ${i+1}`);
    b.setAttribute("aria-pressed", th.id === theme ? "true" : "false");
    b.onclick = ()=>{ store.set("theme", th.id); applyTheme(); fillSettings(); };
    sw.appendChild(b);
  });
}
function refetch(){ if(lastQuery) getTimes(lastQuery).catch(()=>{}); }

function openSettings(){
  document.getElementById("settingsOverlay").hidden = false;
  document.getElementById("methodSelect").focus();
}
function closeSettings(){
  document.getElementById("settingsOverlay").hidden = true;
  document.getElementById("settingsBtn").focus();
}

/* ---------- الأحداث ---------- */
document.getElementById("langBtn").addEventListener("click", e=>{
  e.stopPropagation();
  document.getElementById("langMenu").hidden ? openLangMenu() : closeLangMenu();
});
document.getElementById("langMenu").addEventListener("keydown", e=>{
  const items = [...e.currentTarget.querySelectorAll("button")];
  const i = items.indexOf(document.activeElement);
  if(e.key === "ArrowDown"){ e.preventDefault(); items[(i+1)%items.length].focus(); }
  if(e.key === "ArrowUp"){ e.preventDefault(); items[(i-1+items.length)%items.length].focus(); }
});
document.addEventListener("click", e=>{
  if(!e.target.closest(".langwrap")) closeLangMenu();
});
document.addEventListener("keydown", e=>{
  if(e.key !== "Escape") return;
  if(!document.getElementById("langMenu").hidden){ closeLangMenu(); document.getElementById("langBtn").focus(); }
  if(!document.getElementById("settingsOverlay").hidden) closeSettings();
});

document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("methodLine").addEventListener("click", openSettings);
document.getElementById("closeSettings").addEventListener("click", closeSettings);
document.getElementById("settingsOverlay").addEventListener("click", e=>{ if(e.target.id === "settingsOverlay") closeSettings(); });

document.getElementById("methodSelect").addEventListener("change", e=>{
  methodChoice = e.target.value; store.set("method", methodChoice); refetch();
});
document.getElementById("asrSelect").addEventListener("change", e=>{
  asrChoice = e.target.value; store.set("asr", asrChoice); refetch();
});
document.querySelectorAll(".seg button[data-mode]").forEach(b=> b.addEventListener("click", ()=>{
  store.set("mode", b.dataset.mode); applyTheme(); fillSettings();
}));
document.querySelectorAll(".seg button[data-fmt]").forEach(b=> b.addEventListener("click", ()=>{
  timeFmt = b.dataset.fmt; store.set("fmt", timeFmt); fillSettings();
  if(lastData) render(lastData, lastLabel);
}));

document.getElementById("cityInput").addEventListener("keydown", e=>{ if(e.key==="Enter") searchCity(); });
document.getElementById("year").textContent = new Date().getFullYear();

/* ---------- التشغيل ---------- */
lang = pickLang();
applyLang();
useLocation();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
</script>
