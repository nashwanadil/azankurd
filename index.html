<style>
  :root{
    --bg:#2a1d17; --card:#362720; --line:#4f3b2f; --inner:#2f221b;

  }

    background:var(--bg); color:var(--text);
    font-family:'Noto Kufi Arabic','Noto Sans',sans-serif; line-height:1.8;
    background-image:radial-gradient(circle at 50% 0%, #4a3226 0%, transparent 60%);
    min-height:100vh;
  }
  html[dir=ltr] body{font-family:'Noto Sans','Noto Kufi Arabic',sans-serif}
  .topbar{max-width:720px;margin:0 auto;padding:16px 16px 0;display:flex;justify-content:flex-end}
  .topbar select{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:6px 12px;font-family:inherit;font-size:.9rem;cursor:pointer
  }
  header{text-align:center;padding:32px 16px 28px}
  .brand{display:flex;align-items:center;justify-content:center;gap:14px}
  .brand img{width:60px;height:60px;border-radius:15px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .logo{font-family:'Amiri',serif;font-size:3rem;color:#fff;font-weight:700;letter-spacing:1px}
  .sub{color:var(--muted);font-size:.95rem;margin-top:4px}
  main{max-width:720px;margin:0 auto;padding:0 16px 48px}
  section{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:28px 22px;margin-bottom:24px;
  }
  h2{font-size:1.15rem;color:var(--gold);margin-bottom:18px;text-align:center;font-weight:600}
  .azan{text-align:center}
  .azan .ar{font-family:'Amiri',serif;font-size:1.65rem;line-height:2.3;direction:rtl}
  .azan .tr{color:var(--muted);font-size:.95rem;margin-top:4px}
  .azan .note{font-size:.85rem;color:var(--muted);margin-top:16px;line-height:1.7}
  .divider{width:60px;height:2px;background:var(--gold);margin:18px auto;opacity:.6}
  .next{text-align:center;margin-bottom:18px}
  .next .name{font-size:1.4rem;color:var(--gold);font-weight:600}
  .next .count{font-size:2rem;font-variant-numeric:tabular-nums;letter-spacing:2px;direction:ltr}
  .times{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
  .t{background:var(--inner);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
  .t.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .t span{display:block;color:var(--muted);font-size:.85rem}
  .t b{font-size:1.2rem;font-variant-numeric:tabular-nums}
  .loc{text-align:center;color:var(--muted);font-size:.85rem;margin-top:14px}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  input,button{font-family:inherit;font-size:.95rem;border-radius:10px;border:1px solid var(--line);padding:8px 14px}
  input{background:var(--inner);color:var(--text);min-width:0;flex:1;max-width:240px}
  button{background:var(--green);color:#fff;border-color:var(--green);cursor:pointer}
  button.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .method{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:.85rem}
  .method select{background:var(--inner);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:inherit;font-size:.85rem;max-width:100%}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 32px}

/* ---------- نص الآذان (يبقى بالعربية دائماً) ---------- */
const ADHAN = [
  [['اللهُ أكبرُ، اللهُ أكبرُ','akbar'],['اللهُ أكبرُ، اللهُ أكبرُ','akbar']],
  [['أشهدُ أن لا إلهَ إلا الله','shahada1'],['أشهدُ أن لا إلهَ إلا الله','shahada1']],
  [['أشهدُ أنَّ محمداً رسولُ الله','shahada2'],['أشهدُ أنَّ محمداً رسولُ الله','shahada2']],
  [['حيَّ على الصلاة، حيَّ على الصلاة','salah'],['حيَّ على الفلاح، حيَّ على الفلاح','falah']],
  [['اللهُ أكبرُ، اللهُ أكبرُ','akbar'],['لا إلهَ إلا الله','tawhid']]
];
const ORDER = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];

let lang = 'ar', timings = null, tz = null, timer = null, lastData = null, lastLabel = null;
const L = () => I18N[lang];

function pickLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if(q && I18N[q]) return q;
  try{ const s = localStorage.getItem('lang'); if(s && I18N[s]) return s; }catch(e){}
  for(const n of (navigator.languages || [navigator.language || 'ar'])){
    const c = n.toLowerCase();
    if(c.startsWith('ckb')) return 'ckb';
    if(c.startsWith('ku') || c.startsWith('kmr')) return 'kmr';
    const p = c.slice(0,2); if(I18N[p]) return p;
  }
  return 'ar';
}

function applyLang(){
  const t = L();
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.title = t.logo + ' | AzanKurd';
  document.getElementById('logo').textContent = t.logo;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t[el.dataset.i]);
  document.getElementById('cityInput').placeholder = t.cityPh;
  renderAdhan();
  fillMethods();
  if(lastData) render(lastData, lastLabel); else document.getElementById('locText').textContent = t.locating;
}

function renderAdhan(){
  const t = L(), box = document.getElementById('azan'); box.innerHTML = '';
  ADHAN.forEach((group,i)=>{
    if(i) box.insertAdjacentHTML('beforeend','<div class="divider"></div>');
    group.forEach(([ar])=> box.insertAdjacentHTML('beforeend',`<p class="ar">${ar}</p>`));
    if(t.adhan){
      [...new Set(group.map(g=>g[1]))].forEach(k=>
        box.insertAdjacentHTML('beforeend',`<p class="tr">${t.adhan[k]}</p>`));
    }
  });
  box.insertAdjacentHTML('beforeend',
    `<div class="divider"></div><p class="note">${t.fajrNote}</p><p class="ar">الصلاةُ خيرٌ من النوم</p>` +
    (t.adhan ? `<p class="tr">${t.adhan.sleep}</p>` : ''));
}

/* ---------- المواقيت ---------- */
function render(data, label){
  lastData = data; lastLabel = label;
  const t = L();
  timings = data.timings; tz = data.meta.timezone;
  const box = document.getElementById('times'); box.innerHTML = '';
  ORDER.forEach(k=>{
    const d = document.createElement('div'); d.className='t'; d.id='t-'+k;
    d.innerHTML = `<span>${t.names[k]}</span><b>${timings[k].slice(0,5)}</b>`;
    box.appendChild(d);
  });
  const h = data.date.hijri;
  const month = (t.dir==='rtl') ? h.month.ar : h.month.en;
  const place = label === '@here' ? t.yourLoc : label;
  document.getElementById('locText').textContent = `${place} — ${h.day} ${month} ${h.year} ${t.hijri}`;
  clearInterval(timer); tick(); timer = setInterval(tick, 1000);
}

function nowInTz(){ return new Date(new Date().toLocaleString('en-US',{timeZone:tz,hour12:false})); }

function tick(){
  if(!timings) return;
  const now = nowInTz();
  let next = null, nextDate = null;
  for(const k of ORDER){
    if(k==='Sunrise') continue;
    const [h,m] = timings[k].slice(0,5).split(':').map(Number);
    const d = new Date(now); d.setHours(h,m,0,0);
    if(d > now){ next = k; nextDate = d; break; }
  }
  if(!next){
    const [h,m] = timings.Fajr.slice(0,5).split(':').map(Number);
    nextDate = new Date(now); nextDate.setDate(now.getDate()+1); nextDate.setHours(h,m,0,0); next='Fajr';
  }
  const diff = Math.max(0, Math.floor((nextDate-now)/1000));
  const p = n => String(n).padStart(2,'0');
  document.getElementById('nextName').textContent = L().names[next];
  document.getElementById('countdown').textContent = `${p(Math.floor(diff/3600))}:${p(Math.floor(diff%3600/60))}:${p(diff%60)}`;
  ORDER.forEach(k=>document.getElementById('t-'+k).classList.toggle('active', k===next));
}

    'Europe/Paris':12,'Europe/Lisbon':22,'Asia/Singapore':11,'Asia/Kuala_Lumpur':17,'Asia/Kuching':17,
    'Asia/Jakarta':20,'Asia/Makassar':20,'Asia/Jayapura':20,'Asia/Pontianak':20,
    'Europe/Moscow':14,'Europe/Samara':14,'Europe/Volgograd':14,'Europe/Kazan':14
  };
  if(map[z] !== undefined) return map[z];
  if(z.startsWith('America/')) return 2;
  if(z.startsWith('Europe/')) return 12;
  return 3;
}
let methodChoice = 'auto', usedMethod = 3, autoUsed = null, lastQuery = null;
try{ const m = localStorage.getItem('method'); if(m) methodChoice = m; }catch(e){}

function apiUrl(q, method){
  const school = (method === HANAFI_METHOD) ? 1 : 0;
  const base = 'https://api.aladhan.com/v1/';
  const p = `method=${method}&school=${school}`;
  return q.type === 'coords'
    ? `${base}timings?latitude=${q.lat}&longitude=${q.lng}&${p}`
    : `${base}timingsByAddress?address=${encodeURIComponent(q.city)}&${p}`;
}

async function getTimes(q){
  let method = methodChoice === 'auto' ? 3 : Number(methodChoice);
  let j = await (await fetch(apiUrl(q, method))).json();
  if(j.code !== 200) throw 0;
  if(methodChoice === 'auto'){
    const best = autoMethod(j.data.meta.timezone);
    if(best !== method){
      method = best;
      j = await (await fetch(apiUrl(q, method))).json();
      if(j.code !== 200) throw 0;
    }
  }
  usedMethod = method;
  if(methodChoice === 'auto') autoUsed = method;
  lastQuery = q;
  render(j.data, q.type === 'coords' ? '@here' : q.city);
  fillMethods();
}

async function byCoords(lat, lng){
  try{ await getTimes({type:'coords', lat, lng}); }catch(e){ fallback(); }
}
async function byCity(city){
  try{ await getTimes({type:'city', city}); }
  catch(e){ document.getElementById('locText').textContent = L().notFound; }
}

function fillMethods(){
  const ms = document.getElementById('methodSelect');
  let html = `<option value="auto">${L().auto}${autoUsed !== null ? ' · ' + METHODS[autoUsed] : ''}</option>`;
  Object.entries(METHODS).forEach(([id,name])=> html += `<option value="${id}">${name}</option>`);
  ms.innerHTML = html;
  ms.value = methodChoice;
}
document.getElementById('methodSelect').addEventListener('change', e=>{
  methodChoice = e.target.value;
  try{ localStorage.setItem('method', methodChoice); }catch(err){}
  if(lastQuery) getTimes(lastQuery).catch(()=>{});
});

function searchCity(){ const v = document.getElementById('cityInput').value.trim(); if(v) byCity(v); }
function fallback(){ byCity('Mecca'); }
function useLocation(){
  if(!navigator.geolocation) return fallback();
  navigator.geolocation.getCurrentPosition(
    p=>byCoords(p.coords.latitude, p.coords.longitude), ()=>fallback(), {timeout:8000});
}

/* ---------- التشغيل ---------- */
const sel = document.getElementById('langSelect');
Object.entries(I18N).forEach(([code,t])=> sel.insertAdjacentHTML('beforeend',`<option value="${code}">${t.label}</option>`));
sel.addEventListener('change',()=>{
  lang = sel.value;
  try{ localStorage.setItem('lang', lang); }catch(e){}
  applyLang();
});
document.getElementById('cityInput').addEventListener('keydown',e=>{ if(e.key==='Enter') searchCity(); });
document.getElementById('year').textContent = new Date().getFullYear();

lang = pickLang(); sel.value = lang;
applyLang();
useLocation();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
