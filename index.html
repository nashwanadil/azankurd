<script>
/* ---------- الألوان والمظهر ---------- */
const THEMES = [
  {id:"earth",   h:20,  s:28, accent:"#e0b860", accentL:"#946512", btn:"#8f2a39"},
  {id:"emerald", h:160, s:32, accent:"#e0b860", accentL:"#8a6510", btn:"#1f7a5a"},
  {id:"night",   h:222, s:34, accent:"#e0b860", accentL:"#8a6510", btn:"#3b56b0"},
  {id:"royal",   h:255, s:28, accent:"#d9b25f", accentL:"#7d5bc4", btn:"#5a45b0"},
  {id:"teal",    h:186, s:38, accent:"#f0c674", accentL:"#0f7c7c", btn:"#128a8a"},
  {id:"onyx",    h:30,  s:4,  accent:"#e0b860", accentL:"#8a6510", btn:"#8a6a2a"},
  {id:"rose",    h:332, s:24, accent:"#eab6ca", accentL:"#a03a6a", btn:"#a03a6a"},
  {id:"sand",    h:36,  s:38, accent:"#eeaa45", accentL:"#9a5c0c", btn:"#b5651d"},
  {id:"mono",    h:0,   s:0,  accent:"#f2f2f2", accentL:"#111111", btn:"#111111"},
  {id:"sky",     h:205, s:45, accent:"#93d2ff", accentL:"#1f6fb0", btn:"#1f78c8"}
];
function themeVars(t, mode){
  const H=t.h, S=t.s, hsl=(s,l)=>`hsl(${H} ${s}% ${l}%)`;
  return mode === "light" ? {
    bg:hsl(S*.7,95), card:hsl(S*.6,99), line:hsl(S*.5,85), inner:hsl(S*.6,93), hover:hsl(S*.6,89),
    text:hsl(Math.min(S,30),13), muted:hsl(Math.min(S,18),38), title:hsl(Math.min(S,30),13),
    gold:t.accentL, green:t.btn, glow:hsl(S*.8,88)
  } : {
    bg:hsl(S,12), card:hsl(S,16.5), line:hsl(S,25), inner:hsl(S,13.5), hover:hsl(S,21),
    text:hsl(Math.min(S,30),92), muted:hsl(Math.min(S,20),68), title:"#ffffff",
    gold:t.accent, green:t.btn, glow:hsl(S,22)
  };
}
function applyTheme(){
  let id="earth", mode="light";
  try{ id = localStorage.getItem("theme") || id; mode = localStorage.getItem("mode") || mode; }catch(e){}
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  const v = themeVars(t, mode), r = document.documentElement.style;
  Object.entries(v).forEach(([k,val])=> r.setProperty("--"+k, val));
  document.documentElement.dataset.mode = mode;
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = v.bg;
}
applyTheme();

let lang = "ar", timings = null, tz = null, timer = null, lastData = null, lastLabel = null;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* ---------- اللغة ---------- */
function pickLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if(q && I18N[q]) return q;
  const s = store.get("lang", null);
  if(s === "ckb" || s === "kmr") return "ku";
  if(s && I18N[s]) return s;
  for(const n of (navigator.languages || [navigator.language || "ar"])){
    const c = n.toLowerCase();
    if(c.startsWith("ckb") || c.startsWith("ku") || c.startsWith("kmr")) return "ku";
    const p = c.slice(0,2); if(I18N[p]) return p;
  }
  return "ar";
}

// ترتيب اللغات في القائمة
const LANG_ORDER = ["ar","ku","fa","de","nl","da","en","fr","tr","ur","bs","id","ms","bn","ps","ha","sw","es","it","sv","ru"];
function buildLangMenu(){
  const menu = document.getElementById("langMenu");
  menu.innerHTML = "";
  LANG_ORDER.forEach(code=>{ const t = I18N[code];
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role","menuitemradio");
    b.setAttribute("aria-checked", code === lang ? "true" : "false");
    b.innerHTML = `<img class="flag" alt="" src="${flagSrc(code)}"><span dir="${t.dir}">${t.label}</span><svg class="chk" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>`;
    b.onclick = ()=>{ setLang(code); closeLangMenu(); document.getElementById("langBtn").focus(); };
    menu.appendChild(b);
  });
}
function openLangMenu(){
  buildLangMenu();
  const menu = document.getElementById("langMenu"), btn = document.getElementById("langBtn");
  menu.hidden = false; btn.setAttribute("aria-expanded","true");
  const cur = menu.querySelector('[aria-checked="true"]'); if(cur){ cur.focus(); cur.scrollIntoView({block:"nearest"}); }
}
function closeLangMenu(){
  document.getElementById("langMenu").hidden = true;
  document.getElementById("langBtn").setAttribute("aria-expanded","false");
}
function setLang(code){ lang = code; store.set("lang", code); applyLang(); }

function applyLang(){
  const t = L();
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.title = t.logo === "AzanKurd" ? `AzanKurd | ${t.todayTimes}` : `${t.logo} | ${t.todayTimes} – AzanKurd`;
  const md = document.querySelector('meta[name="description"]'); if(md) md.content = t.tagline + " — AzanKurd";
  document.getElementById("logo").textContent = t.logo;
  document.getElementById("langName").textContent = t.label;
  document.getElementById("allCountriesLink").href = `/${lang}/countries`;
  document.getElementById("langFlag").src = flagSrc(lang);
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t[el.dataset.i]);
  document.getElementById("setCityInput").placeholder = t.cityPh;
  document.getElementById("settingsBtn").setAttribute("aria-label", t.settings);
  document.getElementById("closeSettings").setAttribute("aria-label", t.close);
  renderAdhan();
  fillSettings();
  if(typeof renderNotice === 'function') renderNotice();
  if(lastData) render(lastData, lastLabel); else document.getElementById("locText").textContent = t.locating;
}

function renderAdhan(){
  const t = L(), box = document.getElementById("azan"); box.innerHTML = "";
  ADHAN.forEach((group,i)=>{
    if(i) box.insertAdjacentHTML("beforeend",'<div class="divider"></div>');
    group.forEach(([ar])=> box.insertAdjacentHTML("beforeend",`<p class="ar">${ar}</p>`));
    if(t.adhan){
      [...new Set(group.map(g=>g[1]))].forEach(k=>
        box.insertAdjacentHTML("beforeend",`<p class="tr">${t.adhan[k]}</p>`));
    }
  });
  box.insertAdjacentHTML("beforeend",
    `<div class="divider"></div><p class="note">${t.fajrNote}</p><p class="ar">الصلاةُ خيرٌ من النوم</p>` +
    (t.adhan ? `<p class="tr">${t.adhan.sleep}</p>` : ""));
}

/* ---------- عرض الوقت ---------- */
function fmtTime(hhmm){
  if(timeFmt === "24") return hhmm;
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date(2000,0,1,h,m);
  const loc = lang === "ku" ? "ar" : lang;
  try{
    return new Intl.DateTimeFormat(loc + "-u-nu-latn",{hour:"numeric",minute:"2-digit",hour12:true}).format(d);
  }catch(e){
    return `${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`;
  }
}

function nowInTz(){ return new Date(new Date().toLocaleString("en-US",{timeZone:tz,hour12:false})); }

function tick(){
  if(!timings) return;
  const now = nowInTz();
  let next = null, nextDate = null;
  for(const k of ORDER){
    if(k==="Sunrise") continue;
    const [h,m] = timings[k].slice(0,5).split(":").map(Number);
    const d = new Date(now); d.setHours(h,m,0,0);
    if(d > now){ next = k; nextDate = d; break; }
  }
  if(!next){
    const [h,m] = timings.Fajr.slice(0,5).split(":").map(Number);
    nextDate = new Date(now); nextDate.setDate(now.getDate()+1); nextDate.setHours(h,m,0,0); next="Fajr";
  }
  const diff = Math.max(0, Math.floor((nextDate-now)/1000));
  const p = n => String(n).padStart(2,"0");
  document.getElementById("nextName").textContent = L().names[next];
  document.getElementById("countdown").textContent = `${p(Math.floor(diff/3600))}:${p(Math.floor(diff%3600/60))}:${p(diff%60)}`;
  ORDER.forEach(k=>document.getElementById("t-"+k).classList.toggle("active", k===next));
}

let monthlySlug = null, monthlyKey = null;
async function updateMonthly(q){
  const a = document.getElementById("monthlyLink");
  if(!q || q.type !== "coords"){ a.hidden = true; return; }

    try{
      const j = await (await fetch(`/api/nearest?lat=${q.lat}&lng=${q.lng}`)).json();
      if(monthlyKey === key) monthlySlug = j.slug || null;
    }catch(e){}
  }

  syncWeekSec();

/* ---------- جدول الأسبوع (يُطلب بعد ظهور مواقيت اليوم) ---------- */
let weekDays = null, weekKey = null;
function syncWeekSec(){
  document.getElementById("weekSec").hidden = !weekDays && document.getElementById("monthlyLink").hidden;
}
function calUrl(q, method, y, m){
  const base = `https://api.aladhan.com/v1/`;
  const p = `method=${method}&school=${schoolFor(method)}`;
  return q.type === "coords"
    ? `${base}calendar/${y}/${m}?latitude=${q.lat}&longitude=${q.lng}&${p}`
    : `${base}calendarByAddress/${y}/${m}?address=${encodeURIComponent(q.city)}&${p}`;
}
async function loadWeek(data, q){
  const g = data.date && data.date.gregorian;
  if(!q || !g){ weekDays = null; return syncWeekSec(); }
  const [d, m, y] = g.date.split("-").map(Number);
  const key = JSON.stringify([q.type, q.lat, q.lng, q.city, usedMethod, schoolFor(usedMethod), g.date]);
  if(key === weekKey){ return renderWeek(); }
  weekKey = key; weekDays = null; renderWeek();
  try{
    const get = async (yy, mm) => { const j = await (await fetch(calUrl(q, usedMethod, yy, mm))).json(); if(j.code !== 200) throw 0; return j.data; };
    let days = await get(y, m);
    let i = days.findIndex(x => Number(x.date.gregorian.day) === d);
    if(i < 0) throw 0;
    days = days.slice(i, i + 7);
    if(days.length < 7){
      const nm = m === 12 ? 1 : m + 1, ny = m === 12 ? y + 1 : y;
      days = days.concat((await get(ny, nm)).slice(0, 7 - days.length));
    }
    if(weekKey === key){ weekDays = days; renderWeek(); }
  }catch(e){ if(weekKey === key){ weekDays = null; syncWeekSec(); } }
}
function renderWeek(){
  const tb = document.getElementById("week");
  if(!weekDays){ tb.innerHTML = ""; return syncWeekSec(); }
  const t = L(), loc = (lang === "ku" ? "ar" : lang) + "-u-ca-gregory-nu-latn";
  const short = hm => { const s = fmtTime(hm); return timeFmt === "24" ? s : s.replace(/\s*[^\d:\s]+\.?\s*/g, "").trim() || s; };
  let wd, dm;
  try{ wd = new Intl.DateTimeFormat(loc, {weekday:"short", timeZone:"UTC"}); dm = new Intl.DateTimeFormat(loc, {day:"numeric", month:"numeric", timeZone:"UTC"}); }
  catch(e){ wd = new Intl.DateTimeFormat("en", {weekday:"short", timeZone:"UTC"}); dm = new Intl.DateTimeFormat("en", {day:"numeric", month:"numeric", timeZone:"UTC"}); }
  let h = `<thead><tr><th></th>` + ORDER.map(k => `<th title="${t.names[k]}" aria-label="${t.names[k]}">${PICONS[k]}</th>`).join("") + `</tr></thead><tbody>`;
  weekDays.forEach((x, i) => {
    const gg = x.date.gregorian, dt = new Date(Date.UTC(+gg.year, gg.month.number - 1, +gg.day));
    h += `<tr${i === 0 ? ' class="today"' : ""}><td class="day"><b>${wd.format(dt)}</b><small>${dm.format(dt)}</small></td>` +
      ORDER.map(k => `<td>${short(x.timings[k].slice(0,5))}</td>`).join("") + `</tr>`;
  });
  tb.innerHTML = h + `</tbody>`;
  syncWeekSec();
}

/* ---------- الأماكن ---------- */
function placeLabel(q){
  const t = L();
  if(!q) return "";
  if(q.mecca) return t.mecca;
  if(q.name) return q.country ? q.name + (t.dir === "rtl" ? "، " : ", ") + q.country : q.name;
  if(q.type === "city") return q.city;
  return t.yourLoc;
}
function placeKey(q){ return q.type === "city" ? "c:" + q.city.toLowerCase() : `p:${q.lat},${q.lng}`; }
// مكانان متطابقان إذا كانت إحداثياتهما متقاربة (نفس المدينة بالعربية أو الإنجليزية)
function samePlace(a, b){
  if(!a || !b) return false;
  if(a.type === "coords" && b.type === "coords")
    return Math.abs(a.lat - b.lat) < 0.15 && Math.abs(a.lng - b.lng) < 0.15;
  return placeKey(a) === placeKey(b);
}
const hasArabic = s => /[\u0600-\u06FF]/.test(s || "");
// عند الدمج نُبقي الاسم المكتوب بحروف لغة الواجهة
function betterName(a, b){
  const wantAr = L().dir === "rtl";
  return (hasArabic(a.name) === wantAr || hasArabic(b.name) !== wantAr) ? a : {...a, name:b.name, country:b.country};
}
function getRecent(){
  const raw = (readJSON("recent") || []).filter(x => x && typeof x === "object" && x.type === "coords");
  const out = [];
  raw.forEach(q => { const i = out.findIndex(x => samePlace(x, q)); if(i < 0) out.push(q); else out[i] = betterName(out[i], q); });
  return out;
}
function addRecent(q){
  let list = getRecent();
  const old = list.find(x => samePlace(x, q));
  if(old) q = betterName(q, old);
  list = list.filter(x => !samePlace(x, q));
  list.unshift(q);
  store.set("recent", JSON.stringify(list.slice(0,5)));
}

// البحث عن المدن بقاعدة GeoNames عبر Open-Meteo (تدعم الأسماء بلغات كثيرة)
// فلسطين باسمها في كل اللغات (بدل «الأراضي الفلسطينية»)
const PS_NAMES = { ar:"فلسطين", ku:"فەلەستین", en:"Palestine", de:"Palästina", tr:"Filistin", fa:"فلسطین", ur:"فلسطین",
  fr:"Palestine", es:"Palestina", it:"Palestina", nl:"Palestina", da:"Palæstina", sv:"Palestina", ru:"Палестина",
  bs:"Palestina", id:"Palestina", ms:"Palestin", bn:"ফিলিস্তিন", ps:"فلسطین", ha:"Falasdinu", sw:"Palestina" };
const fixCountry = (cc, name) => String(cc || "").toUpperCase() === "PS" ? (PS_NAMES[lang] || name) : name;
async function geocode(text){
  const g = lang === "ku" ? "ku" : lang;
  let out = [];
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(text)}&count=6&language=${g}&format=json`);
    const j = await r.json();
    out = (j.results || []).map(x => ({
      type:"coords", lat:Math.round(x.latitude*100)/100, lng:Math.round(x.longitude*100)/100,
      name:x.name, country:fixCountry(x.country_code, x.country || ""), admin:x.admin1 || ""
    }));
  }catch(e){}
  // بالحروف العربية: نضيف مدنًا ليس لها اسم عربي (انغولشتات ← Ingolstadt)
  if(/[\u0600-\u06FF]/.test(text) && out.length < 6) out = out.concat((await findArabic(text)).filter(f => !out.some(o => Math.abs(o.lat - f.lat) < .15 && Math.abs(o.lng - f.lng) < .15))).slice(0, 6);
  return out;
}
async function findArabic(text){
  try{
    const lq = readJSON("lastQuery");
    let near = lq && lq.type === "coords" && !lq.mecca ? `&lat=${lq.lat}&lng=${lq.lng}` : "";
    try{ near += "&tz=" + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone || ""); }catch(e){}
    const j = await (await fetch(`/api/find?q=${encodeURIComponent(text.trim())}${near}`)).json();
    let dn = null; try{ dn = new Intl.DisplayNames([lang === "ku" ? "ar" : lang], {type:"region"}); }catch(e){}
    return j.map(c => ({
      type:"coords", lat:Math.round(c.lat*100)/100, lng:Math.round(c.lng*100)/100,
      // تطابق كامل: نعرض الاسم كما كتبه الزائر، ونضع الاسم الأصلي تحته
      name: c.exact ? text.trim() : c.name, admin: c.exact ? c.name : "",
      country: fixCountry(c.cc, dn ? (dn.of(c.cc) || c.cc) : c.cc)
    }));
  }catch(e){ return []; }
}
// اسم المدينة من الإحداثيات (للموقع التلقائي)
async function reverseName(lat, lng){
  try{
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 4000);
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=${lang === "ku" ? "ckb" : lang}`, {signal:ctl.signal});
    const j = await r.json();
    const name = j.city || j.locality || "";
    return name ? {name, country:fixCountry(j.countryCode, j.countryName || "")} : {};
  }catch(e){ return {}; }
}
// لا نعتمد على بحث Aladhan بالاسم لأنه قد يعيد مواقيت خاطئة لاسم غير معروف
async function placeFromText(text){
  const r = await geocode(text);
  return r.length ? r[0] : null;
}

async function getTimes(q, opts = {}){
  let method = methodChoice === "auto" ? 3 : Number(methodChoice);
  let j = await (await fetch(apiUrl(q, method))).json();
  if(j.code !== 200) throw 0;
  if(methodChoice === "auto"){
    const best = autoMethod(j.data.meta.timezone);
    if(best !== method){
      method = best;
      j = await (await fetch(apiUrl(q, method))).json();
      if(j.code !== 200) throw 0;
    }
  }
  usedMethod = method;
  if(methodChoice === "auto") autoUsed = method;
  lastQuery = q;
  render(j.data, q);
  if(opts.save !== false){
    store.set("lastQuery", JSON.stringify(q));
    store.set("cache", JSON.stringify({q, method, methodChoice, asrChoice, data:j.data}));
    if(opts.recent) addRecent(q);
  }
  fillSettings();
}

async function byCoords(lat, lng){
  const r = n => Math.round(n*100)/100;
  const q = {type:"coords", lat:r(lat), lng:r(lng)};
  Object.assign(q, await reverseName(q.lat, q.lng));
  try{ await getTimes(q); }catch(e){ fallback(); }
}

// بحث موحّد: نص أو مكان مختار من الاقتراحات
async function runSearch(arg, statusEl){
  const t = L();
  statusEl.className = "cstatus";
  statusEl.textContent = t.searching;
  const q = typeof arg === "string" ? await placeFromText(arg) : arg;
  try{
    if(!q) throw 0;
    await getTimes(q, {recent:true});
    locState = null; showHelp = false; renderNotice();
    statusEl.classList.add("ok"); statusEl.textContent = "✓ " + t.updated + ": " + placeLabel(q);
    return true;
  }catch(e){
    statusEl.classList.add("err"); statusEl.textContent = t.tryLatin;
    return false;
  }
}
function fallback(){
  if(lastQuery){ locState = null; renderNotice(); return; }   // نبقي آخر موقع محفوظ بدل مكة
  renderNotice();
  getTimes({type:"coords", lat:21.42, lng:39.83, mecca:true}, {save:false})
    .catch(()=>{ document.getElementById("locText").textContent = L().notFound; });
}

/* ---------- الاقتراحات أثناء الكتابة ---------- */
function hideAC(id){ const l = document.getElementById(id); l.hidden = true; l.innerHTML = ""; l._items = []; }
function attachAC(inputId, listId, onPick, onEnter){
  const inp = document.getElementById(inputId), list = document.getElementById(listId);
  let timer = null, seq = 0, hl = -1;
  list._items = [];
  const paint = ()=> [...list.children].forEach((b,i)=> b.classList.toggle("hl", i === hl));
  inp.addEventListener("input", ()=>{
    clearTimeout(timer);
    const v = inp.value.trim();
    if(v.length < 2){ hideAC(listId); return; }
    timer = setTimeout(async ()=>{
      const my = ++seq, res = await geocode(v);
      if(my !== seq || inp.value.trim() !== v) return;
      list.innerHTML = ""; list._items = res; hl = -1;
      if(!res.length){ list.hidden = true; return; }
      res.forEach(p=>{
        const b = document.createElement("button"); b.type = "button";
        b.innerHTML = `${p.name.replace(/</g,"&lt;")}<br><small>${[p.admin, p.country].filter(Boolean).join(L().dir === "rtl" ? "، " : ", ").replace(/</g,"&lt;")}</small>`;
        b.addEventListener("mousedown", e=> e.preventDefault());
        b.addEventListener("click", ()=>{ hideAC(listId); inp.value = ""; onPick(p); });
        list.appendChild(b);
      });
      list.hidden = false;
    }, 300);
  });
  inp.addEventListener("keydown", e=>{
    const n = list._items.length;
    if(e.key === "ArrowDown" && n){ e.preventDefault(); hl = (hl+1)%n; paint(); }
    else if(e.key === "ArrowUp" && n){ e.preventDefault(); hl = (hl-1+n)%n; paint(); }
    else if(e.key === "Enter"){
      e.preventDefault();
      if(!list.hidden && n){ const p = list._items[Math.max(hl,0)]; hideAC(listId); inp.value = ""; onPick(p); }
      else onEnter();
    }
    else if(e.key === "Escape" && !list.hidden){ e.stopPropagation(); hideAC(listId); }
  });
  inp.addEventListener("blur", ()=> setTimeout(()=> hideAC(listId), 150));
}

/* ---------- حالة إذن الموقع ---------- */
let locState = null, showHelp = false;   // locState: null | "denied" | "unknown"
async function permState(){
  try{ return (await navigator.permissions.query({name:"geolocation"})).state; }catch(e){ return "unknown"; }
}
function useLocation(){
  if(!navigator.geolocation){ locState = "unknown"; return fallback(); }
  navigator.geolocation.getCurrentPosition(
    p=>{ locState = null; showHelp = false; renderNotice(); byCoords(p.coords.latitude, p.coords.longitude); },
    async err=>{
      locState = (err.code === 1 && await permState() === "denied") ? "denied" : "unknown";
      fallback();
    },
    {timeout:10000});
}
function renderNotice(){
  const box = document.getElementById("locNotice"), t = L();
  if(!locState){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById("noticeText").textContent = locState === "denied" ? t.noteDenied : t.noteUnknown;
  document.getElementById("noticeBtn").textContent = locState === "denied" ? t.btnRestore : t.btnEnable;
  const h = document.getElementById("noticeHelp");
  h.hidden = !showHelp; h.textContent = t.helpDenied;
}
document.getElementById("noticeBtn").addEventListener("click", async ()=>{
  if(await permState() === "denied"){ showHelp = true; renderNotice(); return; }
  useLocation();
});
(async ()=>{
  try{
    const p = await navigator.permissions.query({name:"geolocation"});
    p.onchange = ()=>{ if(p.state === "granted") useLocation(); };
  }catch(e){}
})();

document.getElementById("methodSelect").addEventListener("change", e=>{
  methodChoice = e.target.value; store.set("method", methodChoice); refetch();
});
document.getElementById("asrSelect").addEventListener("change", e=>{
  asrChoice = e.target.value; store.set("asr", asrChoice); refetch();
});
document.querySelectorAll(".seg button[data-mode]").forEach(b=> b.addEventListener("click", ()=>{
  store.set("mode", b.dataset.mode); applyTheme(); fillSettings();
}));
document.querySelectorAll(".seg button[data-fmt]").forEach(b=> b.addEventListener("click", ()=>{
  timeFmt = b.dataset.fmt; store.set("fmt", timeFmt); fillSettings();
  if(lastData) render(lastData, lastLabel);
}));


document.getElementById("year").textContent = new Date().getFullYear();

/* ---------- التشغيل ---------- */
lang = pickLang();
applyLang();
(async ()=>{
  const saved = readJSON("lastQuery"), cache = readJSON("cache");
  if(!saved){ useLocation(); return; }
  // اعرض المواقيت المحفوظة فوراً، ثم حدّثها في الخلفية
  if(cache && cache.data && JSON.stringify(cache.q) === JSON.stringify(saved)
     && cache.methodChoice === methodChoice && cache.asrChoice === asrChoice){
    usedMethod = cache.method; if(methodChoice === "auto") autoUsed = cache.method;
    lastQuery = saved;
    render(cache.data, saved);
    fillSettings();
  }
  if(saved.type === "coords" && await permState() === "granted") useLocation();
  else getTimes(saved).catch(()=>{});
})();

/* ---------- تثبيت التطبيق ---------- */
let deferredPrompt = null;
const UA = navigator.userAgent;
const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isMobile = /android|iphone|ipad|ipod/i.test(UA) || isIOS;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const canInstall = () => !isStandalone() && (!!deferredPrompt || isIOS);
function updateInstallUI(){ document.getElementById("installField").hidden = !canInstall(); }
function openInstall(){
  document.getElementById("iosHelp").hidden = !(isIOS && !deferredPrompt);
  document.getElementById("installYes").hidden = isIOS && !deferredPrompt;
  document.getElementById("installOverlay").hidden = false;
}
function closeInstall(){ document.getElementById("installOverlay").hidden = true; }
function maybeShowInstall(){
  if(!canInstall() || !isMobile || store.get("installDismissed","0") === "1") return;
  setTimeout(()=>{ if(canInstall() && document.getElementById("settingsOverlay").hidden) openInstall(); }, 4000);
}
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault(); deferredPrompt = e; updateInstallUI(); maybeShowInstall();
});
window.addEventListener("appinstalled", ()=>{ deferredPrompt = null; closeInstall(); updateInstallUI(); });
document.getElementById("installYes").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice; }catch(e){}
  deferredPrompt = null; closeInstall(); updateInstallUI();
});
document.getElementById("installNo").addEventListener("click", ()=>{
  store.set("installDismissed","1"); closeInstall();
});
document.getElementById("installOverlay").addEventListener("click", e=>{
  if(e.target.id === "installOverlay"){ store.set("installDismissed","1"); closeInstall(); }
});
document.getElementById("installFromSettings").addEventListener("click", ()=>{ closeSettings(); openInstall(); });
updateInstallUI();
if(isIOS) maybeShowInstall();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
</script>
