<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة | أذان كُرد</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f1f0;--card:#fffdf9;--line:#e6d6c2;--text:#2a1d17;--muted:#7a6a5c;--gold:#946512;--btn:#8f2a39;--inner:#f3ebe0}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2a1d17;--card:#362720;--line:#4f3b2f;--text:#f5ece0;--muted:#c4af98;--gold:#e0b860;--btn:#8f2a39;--inner:#2f221b}}
  :root[data-theme="dark"]{--bg:#2a1d17;--card:#362720;--line:#4f3b2f;--text:#f5ece0;--muted:#c4af98;--gold:#e0b860;--btn:#8f2a39;--inner:#2f221b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Kufi Arabic',sans-serif;line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 24px;text-align:center}
  .app{width:84px;height:84px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.2);margin:0 auto 18px;display:block}
  .code{font-family:'Amiri',serif;font-size:4.5rem;line-height:1;color:var(--gold);margin-bottom:10px}
  h1{font-size:1.35rem;font-weight:400;color:var(--text);margin-bottom:8px}
  p{color:var(--muted);font-size:.98rem;margin-bottom:24px}
  .btns{display:flex;flex-direction:column;gap:10px}
  .btn{display:block;padding:14px;border-radius:14px;text-decoration:none;font-size:1rem;font-weight:400;color:#fff;background:var(--btn)}
  .btn.ghost{background:var(--inner);color:var(--gold);border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <img class="app" src="/icon-192.png" alt="أذان كُرد" width="84" height="84">
  <div class="code">404</div>
  <h1>الصفحة غير موجودة</h1>
  <p>الرابط الذي فتحته غير صحيح، أو أن الصفحة انتقلت إلى مكان آخر.</p>
  <div class="btns">
    <a class="btn" href="/?lang=ar">الرئيسية</a>
    <a class="btn ghost" href="/ar/countries">كل البلدان</a>
  </div>
</main>
</body>
</html>
